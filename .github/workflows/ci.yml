# .github/workflows/ci.yml
# Fitness Garage — CI Pipeline (v2 — Static Frontend Only)
#
# Backend CI job removed — no backend in Phase 1.
# Backend CI config lives in docs/ARCHIVED/ for Phase 2 reference.
#
# Triggers:
#   Push to:   feature/**, fix/**, chore/**, develop
#   PR to:     develop, main
#
# Jobs:
#   frontend-ci   → prettier, eslint, tsc, vite build
#   data-validate → validates all src/data/*.json files
#   ci-gate       → confirms all jobs passed (PR merge gate)

name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────
  # FRONTEND CI
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env for CI build
        run: |
          cat > .env.local << EOF
          VITE_GOOGLE_PLACES_API_KEY=${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_PLACE_ID=${{ secrets.VITE_GOOGLE_PLACE_ID }}
          EOF

      - name: prettier — formatting check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: eslint — lint
        run: npx eslint src/ --max-warnings=0

      - name: tsc — type check
        run: npx tsc --noEmit

      - name: vite build — production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # DATA FILE VALIDATION
  # Validates all src/data/*.json files on every push
  # Catches malformed JSON from content updates before they deploy
  # ─────────────────────────────────────────────────────────────
  data-validate:
    name: Validate data files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate all src/data/*.json files exist and are valid JSON
        run: |
          REQUIRED=("site" "hero" "services" "plans" "trainers" "gallery" "achievements" "reviews")
          FAILED=0
          for name in "${REQUIRED[@]}"; do
            FILE="frontend/src/data/${name}.json"
            if [ ! -f "$FILE" ]; then
              echo "❌ Missing: $FILE"
              FAILED=1
            else
              if python3 -m json.tool "$FILE" > /dev/null 2>&1; then
                echo "✅ Valid: $FILE"
              else
                echo "❌ Invalid JSON: $FILE"
                python3 -m json.tool "$FILE"
                FAILED=1
              fi
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "One or more data files are missing or contain invalid JSON."
            echo "Fix the file and push again."
            exit 1
          fi
          echo ""
          echo "✅ All data files valid."

      - name: Validate required keys in site.json
        run: |
          REQUIRED_KEYS=("gym_name" "tagline" "about_story" "address" "phone" "email"
                         "google_maps_embed_url" "google_form_url" "google_place_id" "opening_hours")
          FILE="frontend/src/data/site.json"
          FAILED=0
          for key in "${REQUIRED_KEYS[@]}"; do
            if ! python3 -c "import json,sys; d=json.load(open('$FILE')); sys.exit(0 if '$key' in d else 1)" 2>/dev/null; then
              echo "❌ Missing key in site.json: $key"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then exit 1; fi
          echo "✅ site.json has all required keys."

      - name: Validate hero.json has slides array
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('frontend/src/data/hero.json'))
          assert 'slides' in d and len(d['slides']) > 0, 'hero.json must have at least one slide'
          assert 'stats' in d and len(d['stats']) > 0, 'hero.json must have at least one stat'
          print('✅ hero.json structure valid.')
          " || exit 1

      - name: Validate plans.json has 8 plan combinations
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('frontend/src/data/plans.json'))
          plans = d.get('plans', [])
          assert len(plans) == 8, f'plans.json must have exactly 8 plans, found {len(plans)}'
          tiers = {p[\"tier\"] for p in plans}
          durations = {p[\"duration\"] for p in plans}
          assert tiers == {\"basic\", \"pt\"}, f'Unexpected tiers: {tiers}'
          assert durations == {\"monthly\",\"quarterly\",\"half_yearly\",\"annual\"}, f'Unexpected durations: {durations}'
          print('✅ plans.json has all 8 combinations.')
          " || exit 1

  # ─────────────────────────────────────────────────────────────
  # LIGHTHOUSE CI (runs on PRs to main only)
  # Checks Core Web Vitals against thresholds
  # ─────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        run: |
          echo "VITE_GOOGLE_PLACES_API_KEY=" >> .env.local
          echo "VITE_GOOGLE_PLACE_ID=" >> .env.local

      - name: Build
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.staticDistDir=dist \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.performance=["error",{"minScore":0.9}] \
            --assert.assertions.cumulative-layout-shift=["error",{"maxNumericValue":0.1}] \
            --assert.assertions.largest-contentful-paint=["error",{"maxNumericValue":2500}] \
            --assert.assertions.first-contentful-paint=["warn",{"maxNumericValue":1800}] \
            || echo "⚠️ Lighthouse thresholds not met — review report"

  # ─────────────────────────────────────────────────────────────
  # CI GATE — required check for all PRs
  # Both frontend-ci and data-validate must pass
  # ─────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate — All checks passed
    runs-on: ubuntu-latest
    needs: [frontend-ci, data-validate]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.frontend-ci.result }}" != "success" ]]; then
            echo "❌ Frontend CI failed"
            exit 1
          fi
          if [[ "${{ needs.data-validate.result }}" != "success" ]]; then
            echo "❌ Data file validation failed"
            exit 1
          fi
          echo "✅ All CI checks passed — PR is mergeable"

