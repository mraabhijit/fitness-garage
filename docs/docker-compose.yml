# docker-compose.yml
# Fitness Garage — Local Development (v2 — Static Frontend Only)
#
# Phase 1: Frontend only — no backend, no database.
# Backend services (postgres, pgadmin, FastAPI) are documented
# in docs/ARCHIVED/ for Phase 2 wiring.
#
# Services:
#   frontend  — Vite React dev server with hot reload
#
# Usage:
#   Start:          docker compose up
#   Start background: docker compose up -d
#   Stop:           docker compose down
#   Rebuild:        docker compose up --build
#   Logs:           docker compose logs -f frontend
#   Shell:          docker compose exec frontend sh
#
# Note:
#   For most development, running the frontend natively is faster:
#     cd frontend && npm install && npm run dev
#   Use Docker when you need environment parity or are on a shared
#   machine without Node.js installed.

name: fitness-garage

networks:
  fitness-garage-net:
    driver: bridge

services:

  # ───────────────────────────────────────────────────────────
  # FRONTEND — Vite React dev server
  # Hot reload enabled via volume mount
  # ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fitness-garage-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.local
    volumes:
      # Hot reload — mount source, exclude node_modules
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Prevent host node_modules from overriding container node_modules
      - /app/node_modules
    networks:
      - fitness-garage-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ───────────────────────────────────────────────────────────
  # PHASE 2 SERVICES (not active — documented for future use)
