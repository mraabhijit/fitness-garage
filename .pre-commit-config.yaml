# .pre-commit-config.yaml
# Fitness Garage — Pre-commit Hook Configuration (v2 — Static Frontend Only)
#
# Python hooks removed — no backend in Phase 1.
# Backend hooks live in docs/ARCHIVED/ for Phase 2 reference.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# Update hooks to latest versions:
#   pre-commit autoupdate

default_language_version:
  node: "20"

repos:

  # ─────────────────────────────────────────────────────────────
  # GENERAL — applies to all files
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "General › Remove trailing whitespace"

      - id: end-of-file-fixer
        name: "General › Ensure files end with newline"

      - id: check-yaml
        name: "General › Validate YAML syntax"

      - id: check-json
        name: "General › Validate JSON syntax"
        # Covers all src/data/*.json files — catches malformed content updates
        files: \.(json)$
        exclude: node_modules/

      - id: check-toml
        name: "General › Validate TOML syntax"

      - id: check-merge-conflict
        name: "General › Detect unresolved merge conflict markers"

      - id: check-added-large-files
        name: "General › Block files larger than 5MB"
        args: ["--maxkb=5120"]
        # Assets in public/assets/ are excluded — images/videos can be large
        exclude: ^frontend/public/assets/

      - id: detect-private-key
        name: "General › Detect accidentally committed private keys"

      - id: check-case-conflict
        name: "General › Check for case-insensitive filename conflicts"

      - id: mixed-line-ending
        name: "General › Enforce LF line endings"
        args: ["--fix=lf"]

      - id: no-commit-to-branch
        name: "General › Prevent direct commits to main"
        args: ["--branch", "main"]

  # ─────────────────────────────────────────────────────────────
  # SECRET DETECTION — blocks accidental API key commits
  # Critical: VITE_GOOGLE_PLACES_API_KEY must never be committed
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "Security › Detect secrets and credentials"
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            frontend/\.env\.example|
            docs/.*|
            .*\.md
          )$

  # ─────────────────────────────────────────────────────────────
  # TYPESCRIPT / JAVASCRIPT — frontend/src/
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: "TypeScript › prettier — code formatting"
        files: ^frontend/src/
        types_or: [javascript, jsx, ts, tsx, css]
        args: ["--write"]
        additional_dependencies:
          - prettier@3.3.0

  - repo: local
    hooks:
      - id: eslint
        name: "TypeScript › eslint — lint and type-aware checks"
        language: node
        entry: bash -c 'cd frontend && npx eslint --fix src/**/*.{ts,tsx} --max-warnings=0'
        files: ^frontend/src/
        types_or: [ts, tsx]
        pass_filenames: false

      - id: tsc
        name: "TypeScript › tsc — type check (no emit)"
        language: node
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        files: ^frontend/src/
        types_or: [ts, tsx]
        pass_filenames: false

  # ─────────────────────────────────────────────────────────────
  # JSON DATA FILES — src/data/*.json
  # Validates structure of all content data files
  # ─────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-data-files
        name: "Data › Validate src/data/*.json structure"
        language: node
        entry: node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'frontend/src/data';
          const required = ['site','hero','services','plans','trainers','gallery','achievements','reviews'];
          let ok = true;
          required.forEach(f => {
            const file = path.join(dir, f + '.json');
            if (!fs.existsSync(file)) { console.error('Missing: ' + file); ok = false; return; }
            try { JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch(e) { console.error('Invalid JSON: ' + file + ' — ' + e.message); ok = false; }
          });
          if (!ok) process.exit(1);
          console.log('All data files valid.');
        "
        files: ^frontend/src/data/.*\.json$
        pass_filenames: false

  # ─────────────────────────────────────────────────────────────
  # MARKDOWN — documentation files
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        name: "Docs › markdownlint — lint markdown files"
        files: ^docs/.*\.md$
        args:
          - "--config=.markdownlint.json"
          - "--fix"

# ─────────────────────────────────────────────────────────────
# CI configuration
# ─────────────────────────────────────────────────────────────
ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix formatting"
  autoupdate_commit_msg: "chore(pre-commit): autoupdate hook versions"
  autoupdate_schedule: monthly
