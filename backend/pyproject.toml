[project]
name = "fitness-garage-backend"
version = "1.0.0"
description = "Fitness Garage Backend REST API"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "asyncpg>=0.30.0",
  "cryptography>=43.0.0",
  "email-validator>=2.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "reportlab>=4.2.0",
  "supabase>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "black>=24.4.0",
  "isort>=5.13.0",
  "flake8>=7.1.0",
  "flake8-bugbear>=24.4.0",
  "flake8-comprehensions>=3.14.0",
  "flake8-simplify>=0.21.0",
  "mypy>=1.10.0",
  "asyncpg-stubs>=0.29.0",
  "bandit>=1.7.0",
  "sqlfluff>=3.1.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.venv
  | __pycache__
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["migrations/*", "db/migrations/*", ".venv/*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["tests/", "db/migrations/"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"

[tool.bandit]
exclude_dirs = ["tests", "db/migrations"]
severity = "medium"
confidence = "medium"

[tool.sqlfluff.core]
dialect = "postgres"
templater = "raw"
max_line_length = 100
