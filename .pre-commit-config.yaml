# .pre-commit-config.yaml
# Fitness Garage — Pre-commit Hook Configuration
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against all files:
#   pre-commit run --all-files
#
# Update all hooks to latest versions:
#   pre-commit autoupdate

default_language_version:
  python: python3.12
  node: "20"

repos:

  # ─────────────────────────────────────────────────────────────
  # GENERAL — applies to all files
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "General › Remove trailing whitespace"

      - id: end-of-file-fixer
        name: "General › Ensure files end with newline"

      - id: check-yaml
        name: "General › Validate YAML syntax"

      - id: check-json
        name: "General › Validate JSON syntax"

      - id: check-toml
        name: "General › Validate TOML syntax"

      - id: check-merge-conflict
        name: "General › Detect unresolved merge conflict markers"

      - id: check-added-large-files
        name: "General › Block files larger than 5MB"
        args: ["--maxkb=5120"]

      - id: detect-private-key
        name: "General › Detect accidentally committed private keys"

      - id: check-case-conflict
        name: "General › Check for case-insensitive filename conflicts"

      - id: mixed-line-ending
        name: "General › Enforce LF line endings"
        args: ["--fix=lf"]

      - id: no-commit-to-branch
        name: "General › Prevent direct commits to main and develop"
        args: ["--branch", "main", "--branch", "develop"]

  # ─────────────────────────────────────────────────────────────
  # SECRET DETECTION — blocks accidental secret commits
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "Security › Detect secrets and credentials"
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.env\.example|
            docs/.*
          )$

  # ─────────────────────────────────────────────────────────────
  # PYTHON — backend/
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: "Python › black — code formatting"
        files: ^backend/
        language_version: python3.12

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: "Python › isort — import ordering"
        files: ^backend/
        args: ["--profile", "black"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        name: "Python › flake8 — style and lint"
        files: ^backend/
        args:
          - "--max-line-length=100"
          - "--extend-ignore=E203,W503"
          - "--exclude=.git,__pycache__,.venv,migrations"
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: "Python › mypy — type checking"
        files: ^backend/app/|^backend/db/
        args:
          - "--ignore-missing-imports"
          - "--strict"
          - "--exclude=tests/|migrations/"
        additional_dependencies:
          - pydantic
          - fastapi
          - asyncpg-stubs

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: "Python › bandit — security vulnerability scan"
        files: ^backend/app/|^backend/db/
        args:
          - "--recursive"
          - "--severity-level=medium"
          - "--confidence-level=medium"
          - "--exclude=tests/,migrations/,db/migrations/"
        exclude: ^backend/tests/|^backend/db/migrations/

  # ─────────────────────────────────────────────────────────────
  # TYPESCRIPT / JAVASCRIPT — frontend/
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: "TypeScript › prettier — code formatting"
        files: ^frontend/src/
        types_or: [javascript, jsx, ts, tsx, css, json]
        args: ["--write"]
        additional_dependencies:
          - prettier@3.3.0

  - repo: local
    hooks:
      - id: eslint
        name: "TypeScript › eslint — lint and type-aware checks"
        language: node
        entry: bash -c 'cd frontend && npx eslint --fix src/**/*.{ts,tsx} --max-warnings=0'
        files: ^frontend/src/
        types_or: [ts, tsx]
        pass_filenames: false

      - id: tsc
        name: "TypeScript › tsc — type checking (no emit)"
        language: node
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        files: ^frontend/src/
        types_or: [ts, tsx]
        pass_filenames: false

  # ─────────────────────────────────────────────────────────────
  # SQL — migration files
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.0
    hooks:
      - id: sqlfluff-lint
        name: "SQL › sqlfluff — lint migration files"
        files: ^backend/db/migrations/.*\.sql$
        args:
          - "--dialect=postgres"
          - "--rules=AL01,AL02,AL03,AL04,AL05,AM01,AM02,CP01,CP02,CP03,CP04"

      - id: sqlfluff-fix
        name: "SQL › sqlfluff — auto-fix migration files"
        files: ^backend/db/migrations/.*\.sql$
        args:
          - "--dialect=postgres"
          - "--rules=AL01,AL02,AL03,AL04,AL05"

  # ─────────────────────────────────────────────────────────────
  # MARKDOWN — documentation files
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        name: "Docs › markdownlint — lint markdown files"
        files: ^docs/.*\.md$
        args:
          - "--config=.markdownlint.json"
          - "--fix"

# ─────────────────────────────────────────────────────────────
# CI configuration
# ─────────────────────────────────────────────────────────────
ci:
  autofix_commit_msg: "chore(pre-commit): auto-fix formatting"
  autoupdate_commit_msg: "chore(pre-commit): autoupdate hook versions"
  autoupdate_schedule: monthly
