<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="h1_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2C2C2C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="h1_iron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3D"/>
      <stop offset="50%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#D4AF37" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#h1_iron)"/>
  <rect width="1920" height="1080" fill="url(#h1_glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Barbell Silhouette in Background -->
  <g opacity="0.2" transform="translate(960, 540)">
    <rect x="-600" y="-12" width="1200" height="24" rx="12" fill="#D4AF37"/>
    <circle cx="-450" cy="0" r="180" fill="none" stroke="#D4AF37" stroke-width="30"/>
    <circle cx="-450" cy="0" r="140" fill="none" stroke="#D4AF37" stroke-width="10"/>
    <circle cx="450" cy="0" r="180" fill="none" stroke="#D4AF37" stroke-width="30"/>
    <circle cx="450" cy="0" r="140" fill="none" stroke="#D4AF37" stroke-width="10"/>
  </g>
</svg>
